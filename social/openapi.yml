      - $ref: '#/components/parameters/FilterCodeQuery'
      - $ref: '#/components/parameters/FilterTypeQuery'
      - $ref: '#/components/parameters/FilterStatusQuery'
      - $ref: '#/components/parameters/FilterAccessQuery'
      - $ref: '#/components/parameters/FilterMemberQuery'
      - $ref: '#/components/parameters/FilterMemberStatusQuery'
      - $ref: '#/components/parameters/FilterCategoryQuery'
      - $ref: '#/components/parameters/FilterExpiredQuery'
      - $ref: '#/components/parameters/FilterSearchQuery'
      - $ref: '#/components/parameters/FilterCreatedGtQuery'
      - $ref: '#/components/parameters/FilterCreatedGteQuery'
      - $ref: '#/components/parameters/FilterCreatedLtQuery'
      - $ref: '#/components/parameters/FilterCreatedLteQuery'
      - $ref: '#/components/parameters/FilterExpiresGtQuery'
      - $ref: '#/components/parameters/FilterExpiresGteQuery'
      - $ref: '#/components/parameters/FilterExpiresLtQuery'
      - $ref: '#/components/parameters/FilterExpiresLteQuery'
      - $ref: '#/components/parameters/SortQuery4'
      - $ref: '#/components/parameters/IncludeQuery3'
      - $ref: '#/components/parameters/NearQuery'
