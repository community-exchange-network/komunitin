services:
  # Node inspect ports mirror service HTTP ports: 2023 -> 9223, 2025 -> 9225, 2026 -> 9226, 2028 -> 9228.
  app:
    build:
      target: komunitin-app-build
    command: npm run dev
    ports: !override
      - 2030:2030
    volumes:
      - ./app:/app
      # Keep container dependencies, generated files and HTTPS certificates separate.
      - /app/node_modules
      - /app/src-pwa/node_modules
      - /app/dist
      - /app/.quasar
      - /app/tmp

    environment:
      MOCK_ENABLE: ${KOMUNITIN_APP_MOCK}
      MOCK_ENVIRONMENT: development
      MOCK_AUTH: ${KOMUNITIN_APP_MOCK}
      MOCK_ACCOUNTING: ${KOMUNITIN_APP_MOCK}
      MOCK_SOCIAL: ${KOMUNITIN_APP_MOCK}
      MOCK_NOTIFICATIONS: ${KOMUNITIN_APP_MOCK}

  accounting:
    command: pnpm dev
    ports:
      - "2025:2025"
      - "9225:9225"
    volumes:
      - ./accounting:/app
      - /app/node_modules
      - /app/dist

  auth:
    command: pnpm dev
    ports: !override
      - "2026:2026"
      - "9226:9226"
    volumes:
      - ./auth:/app
      - /app/node_modules
      - /app/src/generated
      - /app/dist
  
  social:
    command: pnpm dev
    ports:
      - "2028:2028"
      - "9228:9228"
    volumes:
      - ./social:/app
      - /app/node_modules
      - /app/src/generated
      - /app/dist

  s3mock:
    image: adobe/s3mock:5
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: komunitin
    ports:
      - "9191:9191"

  notifications-ts:
    command: pnpm dev
    ports:
      - "2023:2023"
      - "9223:9223"
    volumes:
      - ./notifications-ts:/app
      - /app/node_modules
      - /app/dist

  cc:
    build:
      context: ./accounting/cc
    ports:
      - "2024:80"
    extra_hosts:
      - "twig.cc-server:127.0.0.1"
      - "branch.cc-server:127.0.0.1"
      - "trunk.cc-server:127.0.0.1"
      - "branch2.cc-server:127.0.0.1"

  db-notifications:
    ports:
      - "6379:6379"
  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
     - REDIS_HOSTS=local:db-notifications:6379
    ports:
     - "2027:8081" 
  
