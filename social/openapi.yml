# Request schemas derived from src/features/*/schema.ts; paths follow routes and controllers.
openapi: 3.1.0
info:
  title: Komunitin Social API
  version: 1.0.0
  description: Community and marketplace API implemented by the Komunitin social service. JSON:API resource
    types include groups, members, offers, needs, categories, users and member-users. Community visibility
    uses access=group, alongside public and private. Resource permissions and lifecycle rules apply in
    addition to OAuth scopes. Request schemas are derived from the service Zod schemas; responses use
    the shared JSON:API envelope. Migration endpoints use plain JSON or server-sent events.
servers:
- url: http://localhost:2028
  description: Local development; replace with your Social service URL.
paths:
  /health:
    get:
      operationId: get_health
      summary: Check service health
      description: ''
      tags:
      - Health
      security: []
      parameters: []
      responses:
        '200':
          description: Service is running.
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  status:
                    const: ok
        default:
          $ref: '#/components/responses/Error'
  /groups:
    get:
      operationId: get_groups
      summary: List accessible communities
      description: When a bearer token is supplied, social:read is required.
      tags:
      - Communities
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PageSizeQuery'
      - $ref: '#/components/parameters/PageAfterQuery'
      - $ref: '#/components/parameters/FilterCodeQuery'
      - $ref: '#/components/parameters/FilterNameQuery'
      - $ref: '#/components/parameters/FilterStatusQuery'
      - $ref: '#/components/parameters/FilterAccessQuery'
      - $ref: '#/components/parameters/FilterSearchQuery'
      - $ref: '#/components/parameters/SortQuery'
      - $ref: '#/components/parameters/IncludeQuery'
      - $ref: '#/components/parameters/NearQuery'
      responses:
        '200':
          description: Success.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Collection'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: post_groups
      summary: Create a community application
      description: Optional included group-settings configure the new community. Currency request attributes
        in meta.request.currency are validated by Accounting on activation and must serialize to fewer
        than 10000 characters. Requires social:write scope and resource permissions.
      tags:
      - Communities
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IncludeQuery'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/createGroupBodySchema'
      responses:
        '201':
          description: Success.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /{code}:
    get:
      operationId: get_code
      summary: Get a community
      description: When a bearer token is supplied, social:read is required.
      tags:
      - Communities
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CodePath'
      - $ref: '#/components/parameters/IncludeQuery'
      responses:
        '200':
          description: Success.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: patch_code
      summary: Update a community
      description: Requires social:write scope and resource permissions.
      tags:
      - Communities
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CodePath'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/patchGroupBodySchema'
      responses:
        '200':
          description: Success.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: delete_code
      summary: Delete a community
      description: Requires social:write scope and resource permissions.
      tags:
      - Communities
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CodePath'
      responses:
        '204':
          description: Completed; no response body.
        default:
          $ref: '#/components/responses/Error'
  /{code}/settings:
    get:
      operationId: get_code_settings
      summary: Get community settings
      description: When a bearer token is supplied, social:read is required.
