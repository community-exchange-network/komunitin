services:
  app:
    build:
      target: komunitin-app-build
    command: npm run dev
    ports: !override
      - 2030:2030
    volumes:
      - ./app:/app
      # Keep container dependencies, generated files and HTTPS certificates separate.
      - /app/node_modules
      - /app/src-pwa/node_modules
      - /app/dist
      - /app/.quasar
      - /app/tmp

    environment:
      MOCK_ENABLE: ${KOMUNITIN_APP_MOCK}
      MOCK_ENVIRONMENT: development
      MOCK_AUTH: ${KOMUNITIN_APP_MOCK}
      MOCK_ACCOUNTING: ${KOMUNITIN_APP_MOCK}
      MOCK_SOCIAL: ${KOMUNITIN_APP_MOCK}
      MOCK_NOTIFICATIONS: ${KOMUNITIN_APP_MOCK}

  accounting:
    command: pnpm dev
    ports:
      - "2025:2025"
      - "9229:9229"
    volumes:
      - ./accounting/cli:/app/cli
      - ./accounting/openapi:/app/openapi
      - ./accounting/prisma:/app/prisma
      - ./accounting/src:/app/src
      - ./accounting/test:/app/test
      - ./accounting/.env:/app/.env
      - ./accounting/package.json:/app/package.json
      - ./accounting/pnpm-lock.yaml:/app/pnpm-lock.yaml
  
  notifications-ts:
    command: pnpm dev
    ports:
      - "2023:2023"
      - "9223:9229"
    volumes:
      - ./notifications-ts/src:/app/src
      - ./notifications-ts/prisma:/app/prisma
      - ./notifications-ts/.env:/app/.env
      - ./notifications-ts/package.json:/app/package.json
      - ./notifications-ts/pnpm-lock.yaml:/app/pnpm-lock.yaml

  cc:
    build:
      context: ./accounting/cc
    ports:
      - "2024:80"
    extra_hosts:
      - "twig.cc-server:127.0.0.1"
      - "branch.cc-server:127.0.0.1"
      - "trunk.cc-server:127.0.0.1"
      - "branch2.cc-server:127.0.0.1"

  phpmyadmin:
    image: phpmyadmin
    restart: unless-stopped
    depends_on:
      - db-integralces
    environment:
      PMA_HOSTS: "db-integralces,db-accounting"
      PMA_PORTS: "3306,5432"
    ports:
      - "2026:80"
  db-notifications:
    ports:
      - "6379:6379"
  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
     - REDIS_HOSTS=local:db-notifications:6379
    ports:
     - "2027:8081" 
  