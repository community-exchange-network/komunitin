            schema:
              $ref: '#/components/schemas/patchMemberBodySchema'
      responses:
        '200':
          description: Success.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: delete_code_members_member
      summary: Delete a member profile
      description: Administrators can delete directly. Owners confirm through an emailed action token
        in meta.token. Bearer authentication, when supplied, requires social:write. Account deletion constraints
        also apply.
      tags:
      - Members
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CodePath'
      - $ref: '#/components/parameters/MemberPath'
      responses:
        '204':
          description: Completed; no response body.
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: false
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                meta:
                  type: object
                  properties:
                    token:
                      type: string
                  required:
                  - token
