    post:
      operationId: post_code_members
      summary: Create a member profile
      description: Requires social:write scope and resource permissions.
      tags:
      - Members
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CodePath'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/createMemberBodySchema'
      responses:
        '201':
          description: Success.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /{code}/members/{member}:
    get:
      operationId: get_code_members_member
      summary: Get a member profile
      description: When a bearer token is supplied, social:read is required.
      tags:
      - Members
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CodePath'
      - $ref: '#/components/parameters/MemberPath'
      - $ref: '#/components/parameters/IncludeQuery2'
      responses:
        '200':
          description: Success.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: patch_code_members_member
      summary: Update a member profile
      description: Requires social:write scope and resource permissions.
      tags:
      - Members
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CodePath'
      - $ref: '#/components/parameters/MemberPath'
