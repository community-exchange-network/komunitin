name: Test Backup
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 4 AM UTC

permissions: {}

jobs:
  test-backup:
    name: Test ${{ matrix.database }} backup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: accounting
            query: >
              SELECT EXISTS (SELECT 1 FROM "Transfer" WHERE created > now() - interval '24 hours')
          - database: notifications
            query: >
              SELECT EXISTS (SELECT 1 FROM "PushSubscription" WHERE "updatedAt" > now() - interval '24 hours')
                  OR EXISTS (SELECT 1 FROM "AppNotification" WHERE "createdAt" > now() - interval '24 hours')
          - database: auth
            query: SELECT EXISTS (SELECT 1 FROM "User")
          - database: social
            tag: social
            query: >
              SELECT EXISTS (SELECT 1 FROM "Member")
                 AND postgis_version() IS NOT NULL
                 AND vector_dims('[1]'::vector) = 1
    services:
      restore:
        image: komunitin/komunitin-db:${{ matrix.tag || 'latest' }}
        env:
          WALG_S3_PREFIX: ${{ vars.S3_PREFIX || 's3://komunitin' }}/db-${{ matrix.database }}
          WALG_COMPRESSION_METHOD: zstd
          AWS_ENDPOINT: ${{ vars.S3_ENDPOINT || 'https://s3.gra.io.cloud.ovh.net' }}
          AWS_REGION: ${{ vars.S3_REGION || 'gra' }}
          AWS_S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE || 'false' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
        options: >-
          --user postgres
          --entrypoint /usr/local/bin/restore_backup.sh
          --health-cmd "psql -Atc 'SELECT NOT pg_is_in_recovery()' | grep -qx t"
          --health-start-period 10m
    steps:
    - name: Verify the backup started in the last 24 hours
      run: |
        label=/var/lib/postgresql/data/backup_label.old
        started_at=$(docker exec ${{ job.services.restore.id }} sed -n 's/^START TIME: //p' "$label")
        echo "Backup started at $started_at"
        test -n "$started_at"
        cutoff=$(date -d '24 hours ago' +%s)
        test "$(date -d "$started_at" +%s)" -ge "$cutoff"
    - name: Verify restored data
      env:
        DATABASE: ${{ matrix.database }}
        QUERY: ${{ matrix.query }}
      run: docker exec ${{ job.services.restore.id }} psql -d "$DATABASE" -Atc "$QUERY" | grep -qx t
