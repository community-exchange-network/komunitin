  /{code}/files/upload:
    post:
      operationId: post_code_files_upload
      summary: Upload an image to S3-compatible storage
      description: Send one file and its resourceType as multipart form data. File size and allowed image
        types are configured by the server. The returned URL is public, independently of resource visibility.
        Requires social:write scope and resource permissions.
      tags:
      - Files
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CodePath'
      responses:
        '201':
          description: Success.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - resourceType
              properties:
                file:
                  type: string
                  format: binary
                  description: One image file. The server accepts any multipart file field name.
                resourceType:
                  type: string
                  enum:
                  - groups
                  - members
                  - offers
                  - needs
  /migrations:
    post:
      operationId: post_migrations
      summary: Import a community CSV ZIP bundle
      description: Requires a superadmin user token. Streams import progress. Requires superadmin scope
        and resource permissions.
      tags:
      - Migrations
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: 'Server-sent events: migration (id), progress (persisted event), end (id and status).'
          headers:
            X-Migration-Id:
              schema:
                type: string
                format: uuid
            Location:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
    get:
      operationId: get_migrations
      summary: List the latest 100 imports
      description: Requires superadmin scope and resource permissions.
      tags:
      - Migrations
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Migration'
        default:
          $ref: '#/components/responses/Error'
  /migrations/{id}:
    get:
      operationId: get_migrations_id
      summary: Get an import
      description: Requires superadmin scope and resource permissions.
      tags:
      - Migrations
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Import state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Migration'
        default:
          $ref: '#/components/responses/Error'
  /migrations/{id}/events:
    get:
      operationId: get_migrations_id_events
      summary: Follow or replay import progress
      description: Requires superadmin scope and resource permissions.
      tags:
      - Migrations
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/AfterQuery'
      - $ref: '#/components/parameters/LastEventIdHeader'
      responses:
        '200':
          description: 'Server-sent events: migration (id), progress (persisted event), end (id and status).'
          headers:
            X-Migration-Id:
              schema:
                type: string
                format: uuid
            Location:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
