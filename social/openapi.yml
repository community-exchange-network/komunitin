      responses:
        '201':
          description: Success.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Document'
        default:
          $ref: '#/components/responses/Error'
  /{code}/posts/{post}:
    get:
      operationId: get_code_posts_post
