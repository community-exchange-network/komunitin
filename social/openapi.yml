                $ref: '#/components/schemas/Collection'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: post_code_posts
      summary: Create an offer or need
      description: The JSON:API resource type is offers or needs. A member relationship is required. Requires
        social:write scope and resource permissions.
      tags:
      - Offers and needs
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CodePath'
      requestBody:
        required: true
        content:
